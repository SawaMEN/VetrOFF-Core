name: Upstream version check
on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * 1'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compare pinned sources to upstream
        run: bash scripts/check-upstream.sh
