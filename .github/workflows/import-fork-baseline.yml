name: Import fork baseline
on:
  push:
    branches: [migration/fork-parity]
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'SawaMEN/VetrOFF-Core'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/import-fork-baseline.sh
      - name: Commit generated patch series
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add patches
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Import fork runtime, tests and dependencies as upstream patches'
          git push origin HEAD:refs/heads/migration/fork-parity
