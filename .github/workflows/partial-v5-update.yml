name: Test partial v5 update without missing dependencies
on:
  push:
    branches: [main]
    paths:
      - 'scripts/test-partial-v5-update.py'
      - '.github/workflows/partial-v5-update.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vetroff-partial-v5-update
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Prepare unified locked sources
        run: bash scripts/prepare.sh
      - name: Stage partial update against unified sources
        run: |
          set -euo pipefail
          python3 scripts/test-partial-v5-update.py .build/hiddify-core update-report
      - name: Run targeted regressions and compile Core
        env:
          CGO_ENABLED: '0'
          GOWORK: 'off'
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          cd .build/hiddify-core
          tags="$(make -s print-CLI_TAGS NAIVE=0)"
          report="$GITHUB_WORKSPACE/update-report"
          pattern='^(TestH_HotReloadLogLevel|TestH_BalancerKeepsConnectionsThroughATentativeMiss|TestH_MonitoringMissOfACachedMemberIsSeenByTheGroups|TestH_IPv6UnavailableItem|TestH_IPv6UnavailableItemOnlyRoutedVia|TestH_SetMemoryLimitKeepsTheOOMKillersLimit|TestH_PsiphonActiveTunnelReachesScanner|TestH_StatusDeepSearchNotifies)$'
          go test -mod=readonly -count=1 -timeout=5m -tags "$tags" -ldflags '-checklinkname=0' -run "$pattern" -v github.com/sagernet/sing-box github.com/sagernet/sing-box/common/monitoring github.com/sagernet/sing-box/protocol/group/balancer github.com/sagernet/sing-box/route/rule github.com/sagernet/sing-box/experimental/libbox github.com/sagernet/sing-box/protocol/psiphon github.com/sagernet/sing-box/hiddify/edgescan | tee "$report/regressions.log"
          for test in TestH_HotReloadLogLevel TestH_BalancerKeepsConnectionsThroughATentativeMiss TestH_MonitoringMissOfACachedMemberIsSeenByTheGroups TestH_IPv6UnavailableItem TestH_IPv6UnavailableItemOnlyRoutedVia TestH_SetMemoryLimitKeepsTheOOMKillersLimit TestH_PsiphonActiveTunnelReachesScanner TestH_StatusDeepSearchNotifies; do
            grep -Fq -- "--- PASS: $test " "$report/regressions.log"
          done
          go build -mod=readonly -trimpath -buildvcs=false -tags "$tags" -ldflags '-checklinkname=0' -o "$RUNNER_TEMP/partial-core" ./cmd/main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partial-v5-update-evidence
          path: update-report/
          if-no-files-found: warn
          retention-days: 21
