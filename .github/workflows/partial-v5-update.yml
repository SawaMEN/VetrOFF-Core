name: Test partial v5 update without missing dependencies
on:
  push:
    branches: [main]
    paths:
      - 'scripts/test-partial-v5-update.py'
      - '.github/workflows/partial-v5-update.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: vetroff-partial-v5-update
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Verify released baseline integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45501843656" > integration.json
          python3 - <<'PY'
          import json, os
          with open("integration.json") as stream:
              run = json.load(stream)
          assert run["path"] == ".github/workflows/combined-candidate.yml"
          assert run["head_sha"] == "ce43716bb022c8f042a74490841303e9bc23d92d"
          assert run["head_branch"] == "main"
          assert run["status"] == "completed" and run["conclusion"] == "success"
          assert run["head_repository"]["full_name"].lower() == os.environ["GITHUB_REPOSITORY"].lower()
          PY
      - uses: actions/download-artifact@v4
        with:
          name: combined-candidate-diagnostics
          path: evidence
          run-id: '45501843656'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: verified-candidate-source
          path: release-source
          run-id: '45506329292'
          github-token: ${{ github.token }}
      - name: Reconstruct and stage partial update
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin ce43716bb022c8f042a74490841303e9bc23d92d
          git worktree add --detach "$RUNNER_TEMP/update-replay" ce43716bb022c8f042a74490841303e9bc23d92d
          cd "$RUNNER_TEMP/update-replay"
          bash scripts/audit-upstream-merge.sh 4e5a9a357003d0a995360586702fd24c53042e3f
          cd "$GITHUB_WORKSPACE"
          (cd release-source && sha256sum -c candidate-src.tar.gz.sha256 && tar -xzf candidate-src.tar.gz)
          python3 scripts/test-partial-v5-update.py "$RUNNER_TEMP/update-replay/.build/hiddify-core" "$RUNNER_TEMP/update-replay/.build/upstream-merge-audit" evidence release-source/candidate-src/hiddify-sing-box update-report
      - name: Run targeted regressions and compile Core
        env:
          CGO_ENABLED: '0'
          GOWORK: 'off'
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          cd release-source/candidate-src
          tags="$(make -s print-CLI_TAGS NAIVE=0)"
          report="$GITHUB_WORKSPACE/update-report"
          pattern='^(TestH_HotReloadLogLevel|TestH_BalancerKeepsConnectionsThroughATentativeMiss|TestH_MonitoringMissOfACachedMemberIsSeenByTheGroups)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partial-v5-update-evidence
          path: update-report/
          if-no-files-found: warn
          retention-days: 21

          go test -mod=readonly -count=1 -timeout=5m -tags "$tags" -ldflags '-checklinkname=0' -run "$pattern" -v github.com/sagernet/sing-box github.com/sagernet/sing-box/common/monitoring github.com/sagernet/sing-box/protocol/group/balancer | tee "$report/regressions.log"
          for test in TestH_HotReloadLogLevel TestH_BalancerKeepsConnectionsThroughATentativeMiss TestH_MonitoringMissOfACachedMemberIsSeenByTheGroups; do
            grep -Fq -- "--- PASS: $test " "$report/regressions.log"
          done
          go build -mod=readonly -trimpath -buildvcs=false -tags "$tags" -ldflags '-checklinkname=0' -o "$RUNNER_TEMP/partial-core" ./cmd/main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sing-box-v5-update-audit
          path: update-report/
          if-no-files-found: warn
          retention-days: 21
