name: Broad v5 candidate integration
on:
  push:
    branches: [main]
    paths:
      - 'scripts/test-broad-v5-update.py'
      - 'scripts/broad-v5-target.json'
      - '.github/workflows/broad-v5-update.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vetroff-broad-v5
  cancel-in-progress: false
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Reproduce locked sources and reduced candidate
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/test-broad-v5-update.py
          bash scripts/prepare.sh
          python3 scripts/test-broad-v5-update.py prepare .build/hiddify-core broad-report
      - name: Verify 26 exact regressions and Core compatibility
        env:
          CGO_ENABLED: '0'
          GOWORK: 'off'
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          cd .build/hiddify-core
          tags="$(make -s print-CLI_TAGS NAIVE=0)"
          test -n "$tags"
          report="$GITHUB_WORKSPACE/broad-report"
          pattern='^(TestH_HotReloadLogLevel|TestH_BalancerKeepsConnectionsThroughATentativeMiss|TestH_MonitoringMissOfACachedMemberIsSeenByTheGroups|TestH_IPv6UnavailableItem|TestH_IPv6UnavailableItemOnlyRoutedVia|TestH_SetMemoryLimitKeepsTheOOMKillersLimit|TestH_PsiphonActiveTunnelReachesScanner|TestH_StatusDeepSearchNotifies|TestH_StoreLastWay|TestH_TryLastWay|TestH_Better|TestH_Search|TestH_SearchLimit|TestH_StatusDeepSearch|TestH_BalancerInterruptsOnlyDeadMember|TestH_HotReloadInbounds|TestH_MASQUELastWay|TestH_MASQUESearchNoise|TestH_MASQUENoiseCandidates|TestH_PsiphonRemembersWay|TestH_PsiphonUseLastWay|TestH_PsiphonSearch|TestH_PsiphonDirectDetour|TestH_PsiphonSearchKeepsTrying|TestH_WARPLastWay|TestH_WARPLastTunnel)$'
          go test -mod=readonly -count=1 -timeout=8m -tags "$tags" -ldflags '-checklinkname=0' -run "$pattern" -v github.com/sagernet/sing-box github.com/sagernet/sing-box/common/monitoring github.com/sagernet/sing-box/protocol/group/balancer github.com/sagernet/sing-box/route/rule github.com/sagernet/sing-box/experimental/libbox github.com/sagernet/sing-box/protocol/psiphon github.com/sagernet/sing-box/hiddify/edgescan github.com/sagernet/sing-box/protocol/masque github.com/sagernet/sing-box/protocol/warp | tee "$report/regressions.log"
          for test in TestH_HotReloadLogLevel TestH_BalancerKeepsConnectionsThroughATentativeMiss TestH_MonitoringMissOfACachedMemberIsSeenByTheGroups TestH_IPv6UnavailableItem TestH_IPv6UnavailableItemOnlyRoutedVia TestH_SetMemoryLimitKeepsTheOOMKillersLimit TestH_PsiphonActiveTunnelReachesScanner TestH_StatusDeepSearchNotifies TestH_StoreLastWay TestH_TryLastWay TestH_Better TestH_Search TestH_SearchLimit TestH_StatusDeepSearch TestH_BalancerInterruptsOnlyDeadMember TestH_HotReloadInbounds TestH_MASQUELastWay TestH_MASQUESearchNoise TestH_MASQUENoiseCandidates TestH_PsiphonRemembersWay TestH_PsiphonUseLastWay TestH_PsiphonSearch TestH_PsiphonDirectDetour TestH_PsiphonSearchKeepsTrying TestH_WARPLastWay TestH_WARPLastTunnel; do
            grep -Fq -- "--- PASS: $test " "$report/regressions.log"
          done
          go test -mod=readonly -count=1 -timeout=8m -tags "$tags" -ldflags '-checklinkname=0' ./v2/config ./v2/config/paneluri ./v2/hcore ./v2/hcore/adminbgservice github.com/hiddify/ray2sing/ray2sing github.com/hiddify/ray2sing/ray2sing_test | tee "$report/core-regressions.log"
          test "$(git -C hiddify-sing-box write-tree)" = "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["candidate_tree"])' "$report/broad-v5.json")"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: broad-v5-diagnostics
          path: broad-report/
          if-no-files-found: warn
          retention-days: 21
      - uses: actions/upload-artifact@v4
        with:
          name: broad-v5-tested-patch
          path: |
            broad-report/broad-v5.patch
            broad-report/broad-v5.json
          if-no-files-found: error
          retention-days: 21
  matrix:
    needs: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: windows, goarch: amd64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: broad-v5-tested-patch
          path: broad-report
      - name: Build verified reduced candidate
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          GOWORK: 'off'
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          bash scripts/prepare.sh
          python3 scripts/test-broad-v5-update.py apply .build/hiddify-core broad-report
          mkdir candidate-dist
          cd .build/hiddify-core
          tags="$(make -s print-CLI_TAGS NAIVE=0)"
          test -n "$tags"
          ext=''
          strip='-s -w'
          if [[ "$GOOS" == windows ]]; then
            tags="${tags//tfogo_checklinkname0,/}"
            tags="${tags//,tfogo_checklinkname0/}"
            strip=-w
            ext=.exe
          fi
          file="vetroff-core-0.0.5-rc-$GOOS-$GOARCH$ext"
          out="$GITHUB_WORKSPACE/candidate-dist"
          go build -mod=readonly -trimpath -buildvcs=false -tags "$tags" -ldflags "$strip -checklinkname=0 -X github.com/hiddify/hiddify-core/v2/hcommon/constants.Version=0.0.5-rc" -o "$out/$file" ./cmd/main
          cd "$out"
          sha256sum "$file" > "$file.sha256"
          cp "$GITHUB_WORKSPACE/broad-report/broad-v5.json" "$file.sources.json"
          if [[ "$GOOS/$GOARCH" == linux/amd64 ]]; then
            "./$file" version | grep -Fx 'VetrOFF-Core 0.0.5-rc'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: broad-v5-rc-${{ matrix.goos }}-${{ matrix.goarch }}
          path: candidate-dist/
          if-no-files-found: error
          retention-days: 21
