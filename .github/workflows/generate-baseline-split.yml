name: Generate verified baseline patch split
on:
  push:
    branches: [maintenance/split-baseline-patches]
    paths:
      - '.github/workflows/generate-baseline-split.yml'
permissions:
  contents: read
jobs:
  split:
    if: github.ref == 'refs/heads/maintenance/split-baseline-patches'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate ordered patch files
        run: python3 scripts/split-baseline-patches.py | tee split-summary.txt
      - name: Verify all locked source trees
        run: bash scripts/prepare.sh
      - name: Commit only verified patch data to the maintenance branch
        run: |
          git diff --exit-code -- .gitmodules hiddify-core hiddify-sing-box ray2sing patches/hiddify-core/expected-tree patches/hiddify-sing-box/expected-tree patches/ray2sing/expected-tree
          cat split-summary.txt >> "$GITHUB_STEP_SUMMARY"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- patches/hiddify-core patches/hiddify-sing-box
          git commit -m 'refactor: split baseline diffs into ordered subsystem patches'
          git push origin HEAD:refs/heads/maintenance/split-baseline-patches
