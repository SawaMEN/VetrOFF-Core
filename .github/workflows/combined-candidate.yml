name: Combined candidate integration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/test-combined-candidate.sh'
      - 'scripts/test-reviewed-route.sh'
      - 'migration/tests/warp_mtu_policy_test.go'
      - 'scripts/verify-combined-dependencies.py'
      - 'scripts/_common.sh'
      - 'scripts/prepare.sh'
      - 'scripts/prepare-dependency-candidates.py'
      - 'scripts/prepare-tailscale-callers.py'
      - 'scripts/fix-masterdns-session-readiness.py'
      - 'scripts/audit-upstream-merge.sh'
      - 'scripts/resolve-upstream-metadata.py'
      - 'scripts/resolve-reviewed-gitlinks.py'
      - '.github/workflows/combined-candidate.yml'
permissions:
  contents: read
concurrency:
  group: combined-candidate-main
  cancel-in-progress: false
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Validate candidate scripts
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 -m py_compile scripts/*.py
          python3 scripts/verify-combined-dependencies.py --self-test
      - name: Audit reviewed candidate trees and manifests
        run: bash scripts/audit-upstream-merge.sh 4e5a9a357003d0a995360586702fd24c53042e3f
      - name: Build and test combined candidate in isolation
        run: bash scripts/test-combined-candidate.sh
      - name: Upload candidate diagnostics, not release binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-candidate-diagnostics
          path: .build/upstream-merge-audit/
          if-no-files-found: warn
          retention-days: 21
