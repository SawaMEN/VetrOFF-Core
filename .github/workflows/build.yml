name: Build VetrOFF Core
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, goos: linux, goarch: amd64 }
          - { runner: ubuntu-24.04, goos: linux, goarch: arm64 }
          - { runner: ubuntu-24.04, goos: windows, goarch: amd64 }
          - { runner: ubuntu-24.04, goos: darwin, goarch: arm64 }
          - { runner: ubuntu-24.04, goos: darwin, goarch: amd64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    steps:
      - name: Checkout patch project
        uses: actions/checkout@v4
      - name: Clone official sources and apply 3 patch stacks
        run: bash scripts/prepare.sh
      - name: Set up upstream Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version-file: .build/hiddify-core/go.mod
          cache: true
          cache-dependency-path: .build/hiddify-core/go.sum
      - name: Build VetrOFF CLI
        run: bash scripts/build.sh --reuse-sources
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
      - name: Upload executable, checksum and provenance
        uses: actions/upload-artifact@v4
        with:
          name: vetroff-core-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/vetroff-core-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error
          retention-days: 21

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: vetroff-core-*
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
