name: Build VetrOFF-Core
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '15 5 * * 1'

permissions:
  contents: read

jobs:
  sources:
    name: Select original source revisions
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      core: ${{ steps.select.outputs.core }}
    steps:
      - uses: actions/checkout@v4
      - id: select
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == schedule ]]; then
            echo 'mode=upstream' >> "$GITHUB_OUTPUT"
            echo "core=$(bash scripts/check-upstream.sh)" >> "$GITHUB_OUTPUT"
          else
            echo 'mode=locked' >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Fork compatibility tests
    needs: sources
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/prepare.sh
        env:
          VETROFF_SOURCE_MODE: ${{ needs.sources.outputs.mode }}
          VETROFF_UPSTREAM_CORE_SHA: ${{ needs.sources.outputs.core }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: .build/hiddify-core/go.mod
          cache-dependency-path: .build/hiddify-core/go.sum
      - run: bash scripts/test.sh --reuse-sources

  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: sources
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/prepare.sh
        env:
          VETROFF_SOURCE_MODE: ${{ needs.sources.outputs.mode }}
          VETROFF_UPSTREAM_CORE_SHA: ${{ needs.sources.outputs.core }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: .build/hiddify-core/go.mod
          cache-dependency-path: .build/hiddify-core/go.sum
      - run: bash scripts/build.sh --reuse-sources
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
      - uses: actions/upload-artifact@v4
        with:
          name: vetroff-core-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/vetroff-core-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error
          retention-days: 21

  release:
    name: Publish stable release
    if: github.event_name != 'schedule' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [test, build]
    runs-on: ubuntu-24.04
    concurrency: vetroff-stable-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: vetroff-core-*
          path: release
          merge-multiple: true
      - name: Publish version with binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(< VERSION)
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag $GITHUB_REF_NAME must match VERSION ($tag)" >&2
            exit 1
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          gh release create "$tag" release/* --target "$GITHUB_SHA" \
            --title "VetrOFF-Core $version" --generate-notes
