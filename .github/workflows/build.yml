name: Build VetrOFF-Core
on:
  workflow_dispatch:
    inputs:
      upstream:
        description: Check the current official Hiddify Core and its dependencies
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ['v*']
    # Audit-only changes do not alter any locked source or stable binary.
    # Tag pushes, manual builds and scheduled upstream checks remain enabled.
    paths-ignore:
      - 'migration/**'
      - 'scripts/audit-upstream-merge.sh'
      - 'scripts/resolve-upstream-metadata.py'
      - 'scripts/prepare-dependency-candidates.py'
      - 'scripts/prepare-tailscale-callers.py'
      - 'scripts/fix-masterdns-session-readiness.py'
      - 'scripts/test-combined-candidate.sh'
      - 'scripts/test-reviewed-*.sh'
      - 'scripts/test-tailscale-candidate.sh'
      - 'scripts/test-warp-combined-candidate.sh'
      - 'scripts/verify-migration-checkpoints.py'
      - '.github/workflows/upstream-merge-audit.yml'
      - '.github/workflows/combined-candidate.yml'
      - '.github/workflows/verify-migration-checkpoints.yml'
      - '.github/workflows/publish-004.yml'
  pull_request:
  schedule:
    - cron: '15 5 * * 1'

permissions:
  contents: read

jobs:
  sources:
    name: Select original source revisions
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      core: ${{ steps.select.outputs.core }}
    steps:
      - uses: actions/checkout@v4
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          CHECK_UPSTREAM: ${{ inputs.upstream }}
        run: |
          if [[ "$EVENT" == schedule || "$CHECK_UPSTREAM" == true ]]; then
            core=$(bash scripts/check-upstream.sh)
            printf 'mode=upstream\ncore=%s\n' "$core" >> "$GITHUB_OUTPUT"
          else
            echo 'mode=locked' >> "$GITHUB_OUTPUT"
          fi

  preflight:
    name: Preflight all three patch series
    needs: sources
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check patch application before the build matrix
        env:
          VETROFF_SOURCE_MODE: ${{ needs.sources.outputs.mode }}
          VETROFF_UPSTREAM_CORE_SHA: ${{ needs.sources.outputs.core }}
        run: |
          if ! bash scripts/prepare.sh; then
            if [[ -f .build/patch-report.md ]]; then
              cat .build/patch-report.md >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 1
          fi
          echo "All three patch series applied successfully." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload conflict diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-patch-diagnostics
          path: |
            .build/*.patch.log
            .build/patch-report.md
          if-no-files-found: warn
          retention-days: 21

  fork_audit:
    name: Check whether personal forks advanced
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compare audited snapshots to fork main branches
        run: bash scripts/audit-forks.sh --strict

  test:
    name: Fork compatibility tests
    needs: [sources, preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/prepare.sh
        env:
          VETROFF_SOURCE_MODE: ${{ needs.sources.outputs.mode }}
          VETROFF_UPSTREAM_CORE_SHA: ${{ needs.sources.outputs.core }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: .build/hiddify-core/go.mod
          cache-dependency-path: .build/hiddify-core/go.sum
      - run: bash scripts/test.sh --reuse-sources

  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [sources, preflight]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/prepare.sh
        env:
          VETROFF_SOURCE_MODE: ${{ needs.sources.outputs.mode }}
          VETROFF_UPSTREAM_CORE_SHA: ${{ needs.sources.outputs.core }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: .build/hiddify-core/go.mod
          cache-dependency-path: .build/hiddify-core/go.sum
      - run: bash scripts/build.sh --reuse-sources
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
      - uses: actions/upload-artifact@v4
        with:
          name: vetroff-core-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/vetroff-core-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error
          retention-days: 21

  release:
    name: Publish stable release
    if: needs.sources.outputs.mode == 'locked' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [sources, test, build]
    runs-on: ubuntu-24.04
    concurrency: vetroff-stable-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: vetroff-core-*
          path: release
          merge-multiple: true
      - name: Publish version with binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(< VERSION)
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag $GITHUB_REF_NAME must match VERSION ($tag)" >&2
            exit 1
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          mkdir publish
          for name in vetroff-core-darwin-amd64 vetroff-core-darwin-arm64 vetroff-core-linux-amd64 vetroff-core-linux-arm64 vetroff-core-windows-amd64.exe; do
            (cd release && sha256sum -c "$name.sha256")
            test -s "release/$name"
            cp "release/$name" "publish/$name"
          done
          (cd publish && sha256sum vetroff-core-* > SHA256SUMS && sha256sum -c SHA256SUMS)
          gh release create "$tag" publish/* --target "$GITHUB_SHA" \
            --title "VetrOFF-Core $version" --generate-notes
