name: Publish verified VetrOFF-Core 0.0.4
on:
  workflow_run:
    workflows: ['VetrOFF-Core 0.0.4 candidate matrix']
    branches: [main]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: vetroff-publish-004
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.id == 45506329292 &&
       github.event.workflow_run.head_sha == 'd3b70cdc85d013f47a93e3105965b139b28486a6' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      MATRIX_RUN: '45506329292'
      MATRIX_SHA: 'd3b70cdc85d013f47a93e3105965b139b28486a6'
      INTEGRATION_RUN: '45501843656'
      INTEGRATION_SHA: 'ce43716bb022c8f042a74490841303e9bc23d92d'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify approved run and all five builds
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MATRIX_RUN" > matrix.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INTEGRATION_RUN" > integration.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MATRIX_RUN/jobs?per_page=100" > jobs.json
          python3 - <<'PY'
          import json, os
          for filename, workflow, sha in (
              ("matrix.json", "candidate-matrix.yml", os.environ["MATRIX_SHA"]),
              ("integration.json", "combined-candidate.yml", os.environ["INTEGRATION_SHA"]),
          ):
              with open(filename) as f:
                  run = json.load(f)
              assert run["path"] == ".github/workflows/" + workflow
              assert run["head_branch"] == "main" and run["head_sha"] == sha
              assert run["head_repository"]["full_name"].lower() == os.environ["GITHUB_REPOSITORY"].lower()
              assert run["status"] == "completed" and run["conclusion"] == "success"
          with open("jobs.json") as f:
              jobs = json.load(f)["jobs"]
          expected = {"source", "build (linux, amd64)", "build (linux, arm64)",
                      "build (windows, amd64)", "build (darwin, arm64)", "build (darwin, amd64)"}
          assert {job["name"] for job in jobs} == expected
          assert all(job["status"] == "completed" and job["conclusion"] == "success" for job in jobs)
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: vetroff-core-0.0.4-rc-*
          path: builds
          merge-multiple: false
          run-id: ${{ env.MATRIX_RUN }}
          github-token: ${{ github.token }}
      - name: Validate binaries and create a single checksum manifest
        run: |
          set -euo pipefail
          mkdir release
          for platform in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64 windows-amd64; do
            prefix="vetroff-core-0.0.4-rc-$platform"
            dir="builds/$prefix"
            name="$prefix"
            target="vetroff-core-$platform"
            if [[ "$platform" == windows-* ]]; then
              name="$name.exe"
              target="$target.exe"
            fi
            test -s "$dir/$name"
            # The only checksum entry must describe this specific binary.
            [[ "$(wc -l < "$dir/$name.sha256")" -eq 1 ]]
            [[ "$(awk '{print $2}' "$dir/$name.sha256")" == "$name" ]]
            (cd "$dir" && sha256sum -c "$name.sha256")
            cp "$dir/$name" "release/$target"
            if [[ "$platform" == linux-amd64 ]]; then
              grep -Fx 'VetrOFF-Core 0.0.4' "$dir/$name.version.txt"
              cp "$dir/$name.sources.json" sources.json
            fi
          done
          (cd release && sha256sum vetroff-core-* > SHA256SUMS && sha256sum -c SHA256SUMS)
          [[ "$(find release -maxdepth 1 -type f | wc -l)" -eq 6 ]]
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path("sources.json").read_text())
          assert source["stable_promotion"] is False
          notes = [
              "VetrOFF-Core 0.0.4 — standalone CLI.",
              "",
              "Five platforms: Linux amd64/arm64, Windows amd64, macOS amd64/arm64.",
              "All binaries are from the verified migration candidate; all 210 conflict resolutions passed integration.",
              "Verify downloads with SHA256SUMS (sha256sum -c SHA256SUMS).",
              "",
              "Integration: https://github.com/SawaMEN/VetrOFF-Core/actions/runs/45501843656",
              "Build matrix: https://github.com/SawaMEN/VetrOFF-Core/actions/runs/45506329292",
              "",
              "Tested source trees:",
          ]
          for key in ("core", "sing_box", "ray2sing", "masterdns_tree"):
              notes.append(f"- {key}: {source[key]}")
          notes += ["", "The release is built via the verified candidate pipeline; the legacy locked-source build remains at 0.0.3 until the patch-stack promotion is completed. Native GUI libraries and mobile builds are not included."]
          Path("release-notes.md").write_text("\n".join(notes) + "\n")
          PY
      - name: Publish the verified release
        run: |
          set -euo pipefail
          if gh release view v0.0.4 --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v0.0.4 already exists; refusing to overwrite" >&2
            exit 1
          fi
          gh release create v0.0.4 release/* --repo "$GITHUB_REPOSITORY" \
            --target "$MATRIX_SHA" --title "VetrOFF-Core 0.0.4" \
            --notes-file release-notes.md --draft
          gh release view v0.0.4 --repo "$GITHUB_REPOSITORY" --json assets,isDraft > release-state.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path("release-state.json").read_text())
          assert state["isDraft"]
          expected = {p.name: p.stat().st_size for p in Path("release").iterdir()}
          actual = {a["name"]: a["size"] for a in state["assets"]}
          assert actual == expected and len(actual) == 6
          PY
          gh release edit v0.0.4 --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view v0.0.4 --repo "$GITHUB_REPOSITORY" --json url,isDraft,isPrerelease,assets
