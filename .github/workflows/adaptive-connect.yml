name: Adaptive Connect candidate
on:
  push:
    branches: [Anti-DPI]
    paths:
      - 'migration/adaptive-connect/**'
      - 'patches/**'
      - 'hiddify-core'
      - 'hiddify-sing-box'
      - 'ray2sing'
      - '.gitmodules'
      - 'VERSION'
      - 'scripts/_common.sh'
      - 'scripts/prepare.sh'
      - 'scripts/test-adaptive-connect.sh'
      - 'scripts/test-anti-dpi-overlay.sh'
      - 'migration/anti-dpi-overlay/**'
      - '.github/workflows/adaptive-connect.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false
      - run: bash scripts/test-adaptive-connect.sh

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: VETROFF_SOURCE_MODE=locked bash scripts/prepare.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: .build/hiddify-core/hiddify-sing-box/go.mod
          cache: false
      - run: bash scripts/test-anti-dpi-overlay.sh --reuse-sources --build-candidate
      - name: Upload tested experimental CLI (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: vetroff-core-anti-dpi-linux-amd64-${{ github.sha }}
          path: dist/anti-dpi/${{ github.sha }}/*
          if-no-files-found: error
          retention-days: 21
