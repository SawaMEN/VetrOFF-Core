name: Generate verified ray2sing rebase
on:
  push:
    branches: [maintenance/rebase-ray2sing-20261124]
    paths:
      - '.github/workflows/generate-ray2sing-rebase.yml'
permissions:
  contents: read
jobs:
  rebase:
    if: github.ref == 'refs/heads/maintenance/rebase-ray2sing-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Merge new upstream with the audited fork tree
        run: bash scripts/rebase-ray2sing.sh a722bf1b184d7fcf10248dee45fc099d62646ca8 | tee /tmp/ray2sing-rebase-summary.txt
      - name: Verify the regenerated patch and all three source trees
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- patches/ray2sing
          git diff --cached --name-only
          git commit -m 'feat: rebase ray2sing fork patches onto a722bf1'
          bash scripts/prepare.sh
          cat /tmp/ray2sing-rebase-summary.txt >> "$GITHUB_STEP_SUMMARY"
          git push origin HEAD:refs/heads/maintenance/rebase-ray2sing-20261124
