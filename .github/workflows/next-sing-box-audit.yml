name: Audit sing-box v5 update after 0.0.4
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-next-sing-box.py'
      - 'scripts/resolve-next-sing-box.py'
      - '.github/workflows/next-sing-box-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vetroff-next-sing-box-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Prepare unified locked sources
        run: bash scripts/prepare.sh
      - name: Audit full v5 update against unified sources
        run: |
          set -euo pipefail
          python3 scripts/audit-next-sing-box.py .build/hiddify-core update-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sing-box-v5-update-audit
          path: update-report/
          if-no-files-found: warn
          retention-days: 21
