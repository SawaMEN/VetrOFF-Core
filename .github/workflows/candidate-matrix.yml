name: VetrOFF-Core 0.0.4 candidate matrix
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful final combined integration run ID'
        required: true
        type: string
      candidate_sha:
        description: 'Exact integration head commit'
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Verify run identity
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > run.json
          python3 - <<'PY'
          import json, os
          with open("run.json") as stream:
              run = json.load(stream)
          assert run["path"] == ".github/workflows/combined-candidate.yml"
          assert run["head_branch"] == "main"
          assert run["head_sha"] == os.environ["CANDIDATE_SHA"]
          assert run["status"] == "completed" and run["conclusion"] == "success"
          assert run["head_repository"]["full_name"].lower() == os.environ["GITHUB_REPOSITORY"].lower()
          PY
      - uses: actions/download-artifact@v4
        with:
          name: combined-candidate-diagnostics
          path: evidence
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Replay exact final source trees
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$CANDIDATE_SHA"
          git worktree add --detach "$RUNNER_TEMP/candidate-replay" "$CANDIDATE_SHA"
          cd "$RUNNER_TEMP/candidate-replay"
          bash scripts/audit-upstream-merge.sh 4e5a9a357003d0a995360586702fd24c53042e3f
          cd "$GITHUB_WORKSPACE"
          python3 scripts/replay-final-candidate.py "$RUNNER_TEMP/candidate-replay/.build/hiddify-core" "$RUNNER_TEMP/candidate-replay/.build/upstream-merge-audit" evidence candidate-src | tee candidate-trees.json
          tar --exclude=.git -czf candidate-src.tar.gz candidate-src
          sha256sum candidate-src.tar.gz > candidate-src.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: verified-candidate-source
          path: |
            candidate-src.tar.gz
            candidate-src.tar.gz.sha256
            candidate-trees.json
          if-no-files-found: error
          retention-days: 7
  build:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-candidate-source
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build candidate CLI from verified source
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          GOWORK: 'off'
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          sha256sum -c candidate-src.tar.gz.sha256
          tar -xzf candidate-src.tar.gz
          mkdir dist
          cd candidate-src
          sha256sum go.mod go.sum > ../core-manifest.sha256
          tags="$(make -s print-CLI_TAGS NAIVE=0)"
          [[ -n "$tags" ]]
          extension=''
          strip='-s -w'
          if [[ "$GOOS" == windows ]]; then
            tags="${tags//tfogo_checklinkname0,/}"
            tags="${tags//,tfogo_checklinkname0/}"
            extension=.exe
            strip=-w
          fi
          name="vetroff-core-0.0.4-rc-$GOOS-$GOARCH$extension"
          go build -mod=readonly -trimpath -buildvcs=false -tags "$tags" -ldflags "$strip -checklinkname=0 -X github.com/hiddify/hiddify-core/v2/hcommon/constants.Version=0.0.4" -o "../dist/$name" ./cmd/main
          sha256sum -c ../core-manifest.sha256
          cd ../dist
          sha256sum "$name" > "$name.sha256"
          cp ../candidate-trees.json "$name.sources.json"
          if [[ "$GOOS/$GOARCH" == linux/amd64 ]]; then
            "./$name" version | tee "$name.version.txt"
            grep -Fx 'VetrOFF-Core 0.0.4' "$name.version.txt"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: vetroff-core-0.0.4-rc-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 21
