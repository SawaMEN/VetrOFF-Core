name: Audit upstream three-way merge
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-upstream-merge.sh'
      - 'scripts/resolve-upstream-metadata.py'
      - 'scripts/prepare-dependency-candidates.py'
      - '.github/workflows/upstream-merge-audit.yml'
      - 'scripts/test-reviewed-tunnel-helpers.sh'
      - 'scripts/test-reviewed-tunnel-transports.sh'
      - 'scripts/test-tailscale-candidate.sh'
      - 'scripts/test-reviewed-dns.sh'
      - 'scripts/test-reviewed-masterdns.sh'
      - 'scripts/test-reviewed-protocols.sh'
      - 'scripts/test-reviewed-vless.sh'
      - 'scripts/fix-masterdns-session-readiness.py'
      - 'scripts/test-reviewed-warp.sh'
      - 'scripts/test-reviewed-masque.sh'
      - 'scripts/test-warp-combined-candidate.sh'
      - 'migration/tests/**'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check migration script syntax
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 -m py_compile scripts/*.py
      - name: Verify reviewed resolutions against the locked baseline
        id: merge_audit
        run: bash scripts/audit-upstream-merge.sh 4e5a9a357003d0a995360586702fd24c53042e3f
      - uses: actions/setup-go@v6
        id: setup_go
        with:
          go-version-file: .build/hiddify-core/hiddify-sing-box/go.mod
          cache-dependency-path: .build/hiddify-core/hiddify-sing-box/go.sum
      - name: Test merged Core options against locked dependencies
        id: core_options
        continue-on-error: true
        timeout-minutes: 8
        run: |
          source scripts/_common.sh
          report="$ROOT/.build/upstream-merge-audit"
          tmp=$(mktemp -d)
          cp "$WORK/go.mod" "$tmp/go.mod"
          cp "$WORK/go.sum" "$tmp/go.sum"
          trap 'cp "$tmp/go.mod" "$WORK/go.mod"; cp "$tmp/go.sum" "$WORK/go.sum"; rm -rf "$tmp"' EXIT
          python3 - "$WORK" "$report" "$tmp/overlay.json" <<'PY'
          import json, sys
          from pathlib import Path
          work, report, overlay = map(Path, sys.argv[1:])
          meta = json.loads((report / "hiddify-core-reviewed.json").read_text())
          paths = ("v2/config/hiddify_option.go", "v2/config/inbound_ports.go", "v2/config/inbound_ports_test.go")
          assert set(paths) <= set(meta["reviewed_resolutions"])
          files = {str(work / p): str(report / "hiddify-core-resolved" / p) for p in paths}
          assert all(Path(p).is_file() for p in files.values())
          overlay.write_text(json.dumps({"Replace": files}))
          PY
          cd "$WORK"
          tags=$(cli_tags)
          CGO_ENABLED=0 go test -mod=mod -overlay "$tmp/overlay.json" -count=1 -timeout=5m -tags "$tags" -ldflags '-checklinkname=0' \
            -run '^Test(VetrOFFMergedOptionsJSON|VetrOFFKeepTopNumericOverrides|LANSharingPasswordJSONDoesNotShadowConfiguredSecret|VPNMode|Sharing|ProxyMode|SystemProxy|PortSwitches|TransparentPorts)' \
            -v ./v2/config 2>&1 | tee "$report/core-options-candidate-test.log"
          grep -Fq -- '--- PASS: TestVetrOFFMergedOptionsJSON' "$report/core-options-candidate-test.log"
          grep -Fq -- '--- PASS: TestVetrOFFKeepTopNumericOverrides' "$report/core-options-candidate-test.log"
      - name: Test reviewed tunnel helpers with the race detector
        run: bash scripts/test-reviewed-tunnel-helpers.sh
      - name: Test reviewed WireGuard and AWG transport packages
        run: bash scripts/test-reviewed-tunnel-transports.sh
      - name: Test reviewed sequential DNS and rating packages
        id: dns_tests
        run: bash scripts/test-reviewed-dns.sh
      - name: Test MasterDNS resolver admission and library candidate
        run: bash scripts/test-reviewed-masterdns.sh
      - name: Test shared edge scanner and WARP classification
        id: warp_tests
        if: ${{ !cancelled() && steps.dns_tests.outcome == 'success' }}
        run: bash scripts/test-reviewed-warp.sh
      - name: Test MASQUE UDP destination regression
        id: masque_tests
        if: ${{ !cancelled() && steps.warp_tests.outcome == 'success' }}
        run: bash scripts/test-reviewed-masque.sh
      - name: Test reviewed DNSTT, Shadowsocks, SSH and FinalMask packages
        if: ${{ !cancelled() && steps.dns_tests.outcome == 'success' }}
        run: bash scripts/test-reviewed-protocols.sh
      - name: Test reviewed VLESS outbound with fork dependencies
        if: ${{ !cancelled() && steps.dns_tests.outcome == 'success' }}
        run: bash scripts/test-reviewed-vless.sh
      - name: Probe combined WARP MASQUE and edgescan candidate
        if: ${{ !cancelled() && steps.warp_tests.outcome == 'success' }}
        run: bash scripts/test-warp-combined-candidate.sh
      - name: Test reviewed network reset and DNS invalidation
        id: network_reset
        if: ${{ !cancelled() && steps.merge_audit.outcome == 'success' && steps.setup_go.outcome == 'success' }}
        timeout-minutes: 8
        run: |
          source scripts/_common.sh
          report="$ROOT/.build/upstream-merge-audit"
          sing="$WORK/hiddify-sing-box"
          tmp=$(mktemp -d)
          cp "$sing/go.mod" "$tmp/go.mod"
          cp "$sing/go.sum" "$tmp/go.sum"
          trap 'cp "$tmp/go.mod" "$sing/go.mod"; cp "$tmp/go.sum" "$sing/go.sum"; rm -rf "$tmp"' EXIT
          python3 - "$sing" "$report" "$tmp" <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          sing, report, tmp = map(Path, sys.argv[1:])
          meta = json.loads((report / "hiddify-sing-box-reviewed.json").read_text())
          paths = ("route/network.go", "route/router.go", "route/h_network_reset_test.go")
          assert set(paths[:2]) <= set(meta["reviewed_resolutions"])
          assert not set(paths) & set(meta["remaining_conflicts"])
          files = {}
          for path in paths:
              target = tmp / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(subprocess.check_output(["git", "-C", str(sing), "show", meta["reviewed_tree"] + ":" + path]))
              files[str(sing / path)] = str(target)
          (tmp / "overlay.json").write_text(json.dumps({"Replace": files}))
          PY
          cd "$sing"
          CGO_ENABLED=1 go test -race -mod=mod -overlay "$tmp/overlay.json" -count=1 -timeout=3m -ldflags '-checklinkname=0' \
            -run '^TestH_NetworkResetReachesTheDNSServers$' -v ./route 2>&1 | tee "$report/network-reset-candidate-test.log"
          grep -Fq -- '--- PASS: TestH_NetworkResetReachesTheDNSServers' "$report/network-reset-candidate-test.log"
      - name: Probe Tailscale candidate against locked dependencies
        if: ${{ !cancelled() && steps.merge_audit.outcome == 'success' && steps.setup_go.outcome == 'success' }}
        run: bash scripts/test-tailscale-candidate.sh
      - name: Enforce Core options regression gate
        if: ${{ !cancelled() && steps.core_options.outcome == 'failure' }}
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-merge-audit
          path: .build/upstream-merge-audit/
          if-no-files-found: warn
          retention-days: 21
